# Settings for the ScalarDB Cluster Java Client SDK.
#
# Every value below is resolved by ScalarDB with environment variable
# interpolation, using the ${env:NAME:-default} syntax. Export the environment
# variable to point the samples at your cluster, or edit the default in place.
#
#   SCALAR_DB_CONTACT_POINT  ScalarDB Cluster host      (default: localhost)
#   SCALAR_DB_USERNAME       ScalarDB Cluster user      (default: scalaradmin)
#   SCALAR_DB_PASSWORD       ScalarDB Cluster password  (default: scalaradmin)

scalar.db.transaction_manager=cluster
scalar.db.contact_points=indirect:${env:SCALAR_DB_CONTACT_POINT:-localhost}

# Authentication settings
scalar.db.cluster.auth.enabled=true
scalar.db.username=${env:SCALAR_DB_USERNAME:-scalaradmin}
scalar.db.password=${env:SCALAR_DB_PASSWORD:-scalaradmin}
#scalar.db.cluster.auth.cache_expiration_time_millis=60000

